_min_copier_version: "9.0.0"
_subdirectory: files
_templates_suffix: .jinja

project_name:
  type: str
  help: Nome del progetto (anche nome del repository GitHub)

project_description:
  type: str
  help: Descrizione in una riga
  default: ""

docs_language:
  type: str
  help: Lingua di documenti, issue e PR (il codice e i commit restano in inglese, ADR-0008)
  choices:
    Italiano: it
    English: en
  default: it

visibility:
  type: str
  help: Visibilità del repository
  choices:
    Pubblico: public
    Privato: private
  default: public

stack:
  type: str
  help: Pacchetto di stack da abilitare
  choices:
    Nessuno (solo nucleo): none
    Next.js + Supabase + Vercel: nextjs-supabase
  default: none

verify_fast:
  type: str
  help: Comando dei controlli rapidi (tipi, lint, test veloci), eseguito alla fine di ogni lavoro dell'agente. Vuoto = nessuno
  default: "{% if stack == 'nextjs-supabase' %}npm run typecheck && npm run lint && npm run test:unit{% endif %}"

verify_full:
  type: str
  help: Comando dei controlli completi (build, test di integrazione), eseguito prima di aprire la PR. Vuoto = come quelli rapidi
  default: "{% if stack == 'nextjs-supabase' %}npm run typecheck && npm run lint && npm run check:dup && npm run test:unit && npm run build{% endif %}"

merge_mode:
  type: str
  help: Chi può fare il merge delle PR
  choices:
    "Solo l'umano": human
    "Gli agenti mergiano i task ai-driven a CI verde (ADR-0004)": ai-driven
  default: human
