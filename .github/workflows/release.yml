name: release

# ADR-0013: a merge to main that changes VERSION publishes the tag vX.Y.Z (read by Copier)
# and a GitHub release. The release only happens if the same checks as a PR pass,
# sample project included.

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag già presente: niente da rilasciare."
            exit 0
          fi
          previous="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          node scripts/release-notes.mjs "$version" "$previous" > "$RUNNER_TEMP/notes.md"
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
