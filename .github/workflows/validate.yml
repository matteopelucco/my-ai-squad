name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Include il progetto campione (tests/sample.sh): il workflow di release (#10) dipenderà da questo job.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install -g @anthropic-ai/claude-code
      - run: pip install copier
      - run: node --test "tests/hooks/*.test.mjs"
      - run: tests/validate.sh
      - if: github.event_name == 'pull_request'
        run: tests/version.sh --bumped origin/${{ github.base_ref }}
